spring.application.name=demo
server.port=${X_ZOHO_CATALYST_LISTEN_PORT:${PORT:8081}}

# Database Connection (Environment Variables with H2 fallback for zero-config local dev)
spring.datasource.url=${DB_URL:jdbc:h2:mem:ksp_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Python AI Service URL
python.ai.url=${PYTHON_AI_URL:http://localhost:8000/api/parse-query}